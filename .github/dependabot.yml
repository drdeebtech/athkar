version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # @vitest/coverage-v8 pins an exact vitest peer, so separate PRs for the
      # two can never install. Keep every vitest package in one PR.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # eslint-config-next 16.3 bundles eslint-plugin-react 7.37, which supports
      # ESLint up to 9 ("contextOrFilename.getFilename is not a function" on 10).
      # Remove once eslint-config-next supports ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # typescript-eslint (8.71, via eslint-config-next) supports TypeScript
      # below 6.1, and no release supports 7 yet. package.json pins "~6.0.3"
      # to match. Raise this hold (and that range) together with
      # typescript-eslint's peer range; remove once TypeScript 7 is supported.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Node.js type definitions must match the oldest Node.js the project runs
      # on (.nvmrc and "engines": 24); newer majors let typecheck accept APIs
      # Node 24 lacks. Raise together with .nvmrc when moving to a newer major.
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

